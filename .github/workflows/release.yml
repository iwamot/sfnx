# Uses iwamot/actions (composite), not iwamot/workflows (reusable):
# PyPI Trusted Publishing rejects reusable workflows because
# job_workflow_ref points to the callee.
# See https://github.com/pypi/warehouse/issues/11096

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      id-token: write  # for PyPI Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            upload.pypi.org:443

      - uses: iwamot/actions/release-draft@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
      - uses: iwamot/actions/uv-publish@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
      - uses: iwamot/actions/release-publish@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
