# Uses iwamot/actions (composite), not iwamot/workflows (reusable):
# PyPI Trusted Publishing rejects reusable workflows because
# job_workflow_ref points to the callee.
# See https://github.com/pypi/warehouse/issues/11096

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      checks: read  # for required CI checks when the shared action waits before tagging
      statuses: read  # for required legacy commit statuses
      id-token: write  # for PyPI Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            upload.pypi.org:443

      - uses: iwamot/actions/release-tag@597ad5f72751d4b28d3540b130dfd69e99274e87 # v2.14.0
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - uses: iwamot/actions/release-draft@597ad5f72751d4b28d3540b130dfd69e99274e87 # v2.14.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
      - uses: iwamot/actions/uv-publish@597ad5f72751d4b28d3540b130dfd69e99274e87 # v2.14.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
      - uses: iwamot/actions/release-publish@597ad5f72751d4b28d3540b130dfd69e99274e87 # v2.14.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
