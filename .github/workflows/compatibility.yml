name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-python.yml@d4650268026c4277d5dc6aee7ef90d4dd57935e4 # v8.13.0
    with:
      python-versions: '["3.11","3.12","3.13","3.14","3.15"]'
